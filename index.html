<style>
/* ============================================================
   JARVEST — Design Tokens
   Palette: after-hours indigo base, brass/amber "money" accent,
   teal for progress/success, coral for attention.
   Type: system serif for character (headings), system sans for
   UI chrome, system mono for every number (ledger precision).
   ============================================================ */
:root{
  --bg:#0F1229;
  --bg-soft:#12163A;
  --surface:#1B1F45;
  --surface-2:#242A57;
  --surface-3:#2C3266;
  --border:rgba(245,241,232,0.09);
  --border-strong:rgba(245,241,232,0.16);

  --amber:#E8A33D;
  --amber-2:#F2B857;
  --amber-soft:rgba(232,163,61,0.16);
  --teal:#4FBF9F;
  --teal-soft:rgba(79,191,159,0.16);
  --coral:#E2604F;
  --coral-soft:rgba(226,96,79,0.16);
  --violet:#8B85E0;
  --violet-soft:rgba(139,133,224,0.16);

  --text:#F5F1E8;
  --text-dim:#AEB3D1;
  --text-faint:#9297C4;

  --radius-xl:32px;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:11px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --font-display:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --ease:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
}
input,textarea{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;-webkit-appearance:none;appearance:none;border:none;background:none;color:inherit;cursor:pointer;}
::-webkit-scrollbar{display:none;}

/* ===================== SPLASH ===================== */
#splash{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(120% 90% at 50% 18%, #1A1F4A 0%, #0F1229 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .6s var(--ease), visibility .6s var(--ease);
}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
.splash-jar{width:96px;height:132px;position:relative;}
.splash-jar svg{width:100%;height:100%;display:block;}
.splash-liquid-clip{animation:splashFill 1.1s var(--ease-spring) .15s both;}
@keyframes splashFill{
  from{transform:translateY(46px);}
  to{transform:translateY(0);}
}
.splash-word{
  font-family:var(--font-display);font-size:32px;letter-spacing:.01em;color:var(--text);
  opacity:0;transform:translateY(6px);
  animation:splashWord .7s var(--ease) .5s forwards;
}
@keyframes splashWord{to{opacity:1;transform:none;}}
.splash-tag{
  font-size:13px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;
  opacity:0;animation:splashWord .7s var(--ease) .75s forwards;
}

/* ===================== APP SHELL ===================== */
.app-shell{
  position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;transition:opacity .5s var(--ease);
}
.app-shell.show{opacity:1;}
#screens{flex:1;min-height:0;position:relative;}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(var(--safe-t) + 18px) 18px calc(88px + var(--safe-b)) 18px;
  -webkit-overflow-scrolling:touch;
  display:none;
  background:radial-gradient(120% 46% at 50% -6%, rgba(232,163,61,.09), transparent 68%);
}
.screen.active{display:block;animation:screenIn .35s var(--ease);}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.page-eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:0 0 2px;}
.page-title{font-family:var(--font-display);font-size:26px;margin:0 0 18px;color:var(--text);}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.greet-wrap{display:flex;flex-direction:column;}
.greet{font-size:13px;color:var(--text-faint);}
.greet-name{font-family:var(--font-display);font-size:22px;color:var(--text);}
.greet-project{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.best-week-ribbon{
  margin-top:12px;padding:9px 13px;border-radius:100px;background:var(--teal-soft);
  border:1px solid rgba(79,191,159,.3);font-size:12px;color:var(--teal);
  display:flex;align-items:center;gap:7px;
}
.suggested-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:-2px -2px 2px;}
.suggested-chip{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 16px;border-radius:var(--radius-md);background:var(--surface);
  border:1px dashed var(--border-strong);min-width:88px;
}
.suggested-chip .s-emoji{font-size:20px;}
.suggested-chip .s-title{font-size:11.5px;text-align:center;color:var(--text-dim);}
.suggested-chip .s-pct{font-size:10px;color:var(--text-faint);}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(155deg,var(--surface-3),var(--surface-2));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  border:1px solid var(--border-strong);flex-shrink:0;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.5), 0 0 0 3px rgba(232,163,61,.08);
}

/* ===================== TAB BAR ===================== */
.tabbar{
  display:flex;align-items:stretch;
  padding:8px calc(6px + var(--safe-l)) calc(6px + var(--safe-b)) calc(6px + var(--safe-r));
  background:rgba(18,22,53,.86);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid var(--border);
  position:relative;z-index:20;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 5px;color:var(--text-faint);transition:color .25s var(--ease);
  position:relative;
}
.tab-btn svg{width:24px;height:24px;transition:transform .3s var(--ease-spring);}
.tab-btn span{font-size:10.5px;letter-spacing:.01em;}
.tab-btn.active{color:var(--amber);}
.tab-btn.active svg{transform:translateY(-1px) scale(1.05);}
.tab-btn:active svg{transform:scale(.88);}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:100px;font-size:15px;font-weight:600;
  transition:transform .15s var(--ease-spring), opacity .2s;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--amber);color:#241605;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-danger{background:var(--coral-soft);color:var(--coral);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;}
.btn:disabled{opacity:.4;pointer-events:none;}

.fab-log{
  width:100%;border-radius:var(--radius-lg);padding:18px 20px;
  background:linear-gradient(155deg,var(--amber-2),var(--amber));
  color:#241605;display:flex;align-items:center;gap:14px;
  box-shadow:0 10px 30px -8px rgba(232,163,61,.45);
  transition:transform .15s var(--ease-spring);
}
.fab-log:active{transform:scale(.98);}
.fab-log-icon{
  width:42px;height:42px;border-radius:50%;background:rgba(36,22,5,.16);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.fab-log-icon svg{width:20px;height:20px;}
.fab-log-text{text-align:left;flex:1;}
.fab-log-title{font-weight:700;font-size:15.5px;}
.fab-log-sub{font-size:12px;opacity:.75;margin-top:1px;}

/* ===================== CARDS / HERO ===================== */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -18px rgba(0,0,0,.55);
}
.section-title{
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);
  margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;
}
.section-title .link{font-size:12px;color:var(--amber);text-transform:none;letter-spacing:0;}

.balance-hero{
  border-radius:var(--radius-xl);padding:22px 20px 18px;
  background:linear-gradient(165deg,var(--surface-3) 0%, var(--surface) 60%);
  border:1px solid var(--border-strong);
  position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 20px 44px -20px rgba(0,0,0,.6);
}
.balance-hero::before{
  content:"";position:absolute;top:-60%;right:-30%;width:70%;height:160%;
  background:radial-gradient(closest-side, rgba(232,163,61,.14), transparent 70%);
  pointer-events:none;
}
.balance-label{font-size:12.5px;color:var(--text-faint);letter-spacing:.04em;}
.balance-amount{font-size:40px;font-weight:500;margin:4px 0 2px;line-height:1;}
.balance-sub{font-size:12.5px;color:var(--text-dim);}
.balance-sub b{color:var(--teal);font-weight:600;}
.balance-stats-row{display:flex;gap:10px;margin-top:16px;}
.mini-stat{flex:1;background:rgba(0,0,0,.16);border-radius:var(--radius-md);padding:10px 12px;}
.mini-stat-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.mini-stat-val{font-size:16px;margin-top:2px;}

/* ===================== POUR VISUALIZATION ===================== */
.pour-card{border-radius:var(--radius-xl);padding:20px 18px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -18px rgba(0,0,0,.55);}
.pour-title{font-size:13px;color:var(--text-faint);margin-bottom:14px;}
.pour-stage{display:flex;flex-direction:column;align-items:center;}
.pour-source{
  width:64px;height:34px;border-radius:10px 10px 4px 4px;
  background:var(--surface-3);border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);
  position:relative;
}
.pour-drop{
  position:absolute;top:100%;left:50%;width:5px;height:5px;border-radius:50%;
  background:var(--amber-2);transform:translateX(-50%);
  animation:pourDrop 1.1s var(--ease) infinite;
}
@keyframes pourDrop{
  0%{opacity:0;transform:translate(-50%,0) scaleY(1);}
  15%{opacity:1;}
  85%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,26px) scaleY(1.8);}
}
.pour-jars{display:flex;gap:16px;margin-top:18px;justify-content:center;flex-wrap:wrap;}
.pour-jar-slot{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;}
.pour-jar-pct{font-size:11px;color:var(--text-faint);}
.pour-jar-name{font-size:10.5px;color:var(--text-dim);text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Jar (SVG-based, reused for hero + buckets grid) */
.jar-svg{display:block;}
.jar-liquid-mask-rect{transition:y 1s var(--ease-spring), height 1s var(--ease-spring);}

/* ===================== BUCKETS GRID ===================== */
.buckets-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
.jar-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;
  position:relative;transition:transform .15s var(--ease-spring);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 26px -18px rgba(0,0,0,.55);
}
.jar-card:active{transform:scale(.97);}
.jar-lock-badge{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  background:var(--amber-soft);display:flex;align-items:center;justify-content:center;
}
.jar-lock-badge svg{width:11px;height:11px;color:var(--amber);}
.jar-card-title{font-size:13.5px;font-weight:600;text-align:center;margin-top:2px;}
.jar-card-sub{font-size:11.5px;color:var(--text-faint);}
.jar-card-pct{
  font-size:10.5px;color:var(--text-dim);background:rgba(0,0,0,.18);
  padding:2px 8px;border-radius:100px;margin-top:2px;
}
.jar-card-complete{border-color:rgba(79,191,159,.4);}
.add-jar-card{
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:168px;color:var(--text-faint);
}
.add-jar-card svg{width:26px;height:26px;}
.add-jar-card span{font-size:12.5px;}

/* ===================== ACTIVITY / RECEIPT ROWS ===================== */
.activity-row{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border);
}
.activity-row:last-child{border-bottom:none;}
.activity-icon{
  width:38px;height:38px;border-radius:50%;background:var(--amber-soft);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
}
.activity-main{flex:1;min-width:0;}
.activity-title{font-size:14px;font-weight:600;}
.activity-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.activity-amt{font-size:15px;color:var(--teal);}
.receipt-line{
  display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;
  font-size:13px;color:var(--text-dim);
  border-bottom:1px dashed var(--border);
}
.receipt-line:last-child{border-bottom:none;}
.receipt-line b{color:var(--text);font-weight:500;}

.empty-state{
  text-align:center;padding:34px 20px;color:var(--text-faint);
}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.6;}
.empty-state p{font-size:13.5px;margin:0;line-height:1.5;}

/* ===================== SHEETS / MODALS ===================== */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(6,7,20,.55);z-index:80;
  opacity:0;visibility:hidden;transition:opacity .3s var(--ease);
  backdrop-filter:blur(2px);
}
.sheet-backdrop.show{opacity:1;visibility:visible;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:var(--bg-soft);border-radius:26px 26px 0 0;
  border:1px solid var(--border-strong);border-bottom:none;
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease-spring);
  padding-bottom:calc(20px + var(--safe-b));
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 2px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;}
.sheet-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:500;}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.sheet-close svg{width:14px;height:14px;color:var(--text-dim);}
.sheet-body{padding:6px 20px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase;}
.input, .textarea, .select{
  width:100%;background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);padding:13px 14px;color:var(--text);font-size:15px;
  font-family:var(--font-body);
}
.input.num-input{font-family:var(--font-mono);font-size:17px;}
.textarea{resize:none;min-height:64px;font-family:var(--font-body);}
.field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;}
.field-hint.warn{color:var(--coral);}

.segmented{display:flex;background:var(--surface-2);border-radius:var(--radius-md);padding:4px;border:1px solid var(--border-strong);}
.segmented button{flex:1;padding:9px 6px;border-radius:12px;font-size:13px;color:var(--text-dim);transition:all .25s var(--ease);}
.segmented button.active{background:var(--amber);color:#241605;font-weight:600;}

.emoji-grid, .swatch-grid{display:flex;flex-wrap:wrap;gap:9px;}
.emoji-opt{
  width:42px;height:42px;border-radius:13px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  border:2px solid transparent;
}
.emoji-opt.sel{border-color:var(--amber);background:var(--amber-soft);}
.swatch-opt{width:34px;height:34px;border-radius:50%;border:2px solid transparent;position:relative;}
.swatch-opt.sel::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--text);
}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row-text b{display:block;font-size:14px;font-weight:600;}
.toggle-row-text span{font-size:12px;color:var(--text-faint);}
.switch{width:46px;height:28px;border-radius:100px;background:var(--surface-3);position:relative;flex-shrink:0;border:1px solid var(--border-strong);transition:background .25s var(--ease);}
.switch.on{background:var(--teal);}
.switch-knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#F5F1E8;transition:transform .25s var(--ease-spring);}
.switch.on .switch-knob{transform:translateX(18px);}

.list-select{display:flex;flex-direction:column;gap:8px;}
.list-select-opt{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:var(--radius-md);background:var(--surface-2);
  border:1.5px solid transparent;
}
.list-select-opt.sel{border-color:var(--amber);}

/* ===================== PROJECTIONS / STATS ===================== */
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 26px -18px rgba(0,0,0,.55);}
.stat-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.proj-card{
  border-radius:var(--radius-lg);padding:16px;background:var(--teal-soft);
  border:1px solid rgba(79,191,159,.3);display:flex;gap:12px;align-items:flex-start;
}
.proj-card svg{width:20px;height:20px;color:var(--teal);flex-shrink:0;margin-top:2px;}
.proj-text{font-size:13.5px;line-height:1.5;color:var(--text);}
.proj-text b{color:var(--teal);}

/* ===================== CHARTS ===================== */
.chart-wrap{padding-top:6px;}
.bar-chart{display:flex;align-items:flex-end;gap:7px;height:130px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-fill{
  width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--amber-2),var(--amber));
  transition:height .6s var(--ease-spring);
}
.bar-label{font-size:9.5px;color:var(--text-faint);}
.bar-val{font-size:9.5px;color:var(--text-dim);}

.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.heat-cell{aspect-ratio:1;border-radius:5px;background:var(--surface-2);}
.heat-cell[data-level="1"]{background:rgba(232,163,61,.35);}
.heat-cell[data-level="2"]{background:rgba(232,163,61,.62);}
.heat-cell[data-level="3"]{background:var(--amber);}
.heatmap-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:10.5px;color:var(--text-faint);}
.heat-dot{width:10px;height:10px;border-radius:3px;}

/* ===================== BADGES ===================== */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.badge-chip{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
}
.badge-chip.locked{opacity:.38;}
.badge-chip .b-icon{font-size:22px;}
.badge-chip .b-label{font-size:10.5px;line-height:1.3;color:var(--text-dim);}
.streak-card{
  border-radius:var(--radius-lg);padding:16px 18px;background:linear-gradient(135deg,var(--amber-soft),transparent);
  border:1px solid rgba(232,163,61,.28);display:flex;align-items:center;gap:14px;
}
.streak-flame{font-size:30px;}
.streak-num{font-size:22px;font-weight:600;}
.streak-label{font-size:12px;color:var(--text-faint);}

/* ===================== WHAT-IF SLIDER ===================== */
.whatif-row{margin-bottom:18px;}
.whatif-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.whatif-top b{color:var(--amber);}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:100px;background:var(--surface-3);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--amber);
  border:3px solid var(--bg-soft);box-shadow:0 2px 8px rgba(0,0,0,.3);
}

/* ===================== CELEBRATION ===================== */
#celebration-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(10,12,30,.72);opacity:0;visibility:hidden;transition:opacity .35s var(--ease);
  flex-direction:column;gap:16px;text-align:center;padding:30px;
}
#celebration-overlay.show{opacity:1;visibility:visible;}
.celeb-coin{
  position:absolute;top:-20px;font-size:22px;
  animation:coinFall linear forwards;
}
@keyframes coinFall{
  to{transform:translateY(115vh) rotate(400deg);opacity:.2;}
}
.celeb-emoji{font-size:56px;animation:celebPop .6s var(--ease-spring);}
@keyframes celebPop{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.celeb-title{font-family:var(--font-display);font-size:24px;}
.celeb-sub{font-size:13.5px;color:var(--text-dim);max-width:280px;}

/* ===================== TOAST ===================== */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,12px);
  background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);
  padding:11px 18px;border-radius:100px;font-size:13px;z-index:150;
  opacity:0;visibility:hidden;transition:all .3s var(--ease-spring);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}

/* misc calculator */
.calc-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--text-dim);}
.calc-row b{color:var(--text);font-family:var(--font-mono);}
.calc-total{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:16px;margin-top:4px;border-top:1px solid var(--border);}
.calc-total b{font-family:var(--font-mono);color:var(--amber);font-size:19px;}

/* ===================== PROJECT SWITCHER ===================== */
.proj-switch{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -18px 4px;
  padding-left:18px;padding-right:18px;
}
.proj-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:100px;background:var(--surface);
  border:1.5px solid var(--border);font-size:13px;color:var(--text-dim);
  transition:border-color .2s, background .2s, color .2s;white-space:nowrap;
}
.proj-chip .pc-emoji{font-size:15px;}
.proj-chip.sel{border-color:var(--amber);background:var(--amber-soft);color:var(--text);}
.proj-chip.add{border-style:dashed;color:var(--text-faint);}

.proj-tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:15px 16px;display:flex;align-items:center;gap:13px;margin-bottom:10px;

/* ===================== ENV BANNER ===================== */

/* ===================== ONBOARDING ===================== */

<script>
/* =====================================================================
   JARVEST — app logic
   Single-file, offline-first. All data lives in localStorage on-device.
   ===================================================================== */

const STORE_KEY = 'jarvest_v1';
const APP_VERSION = '3.0.0';
const GOAL_COLORS = ['#E8A33D','#4FBF9F','#8B85E0','#E2604F','#F2B857','#5FA8D3'];
const GOAL_ICONS = ['🛟','💻','✈️','🎸','🍵','🏠','🚗','🎓','💍','🩺','🐾','🎮','📷','👶','🏝️','🎁','🍹','⛽','🧾','🌧️'];
const CURRENCIES = ['$','€','£','₪'];

var state = null;
var uiState = {
  activeTab: 'home',
  editingGoalId: null,
  logShiftMode: 'total', // 'total' | 'hourly'
  whatifGoalId: null,
};

/* ---------- persistence ----------
   Runs inside all sorts of hosts (a plain browser tab, an installed
   Home Screen app, or a sandboxed preview). Some of those environments
   block localStorage entirely. Every call below is defensive so a
   blocked storage API degrades to an in-memory session instead of
   ever throwing — nothing in the UI should depend on storage
   succeeding to keep working. */
let memoryStore = {};
let persistenceOK = true;
function storageProbe(){
  try{
    const k = '__jarvest_probe__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function safeGet(key){
  if(persistenceOK){
    try{ return localStorage.getItem(key); }catch(e){ persistenceOK=false; }
  }
  return Object.prototype.hasOwnProperty.call(memoryStore,key) ? memoryStore[key] : null;
}
function safeSet(key,val){
  if(persistenceOK){
    try{ localStorage.setItem(key,val); return; }catch(e){ persistenceOK=false; }
  }
  memoryStore[key]=val;
}
function loadState(){
  try{
    const raw = safeGet(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Jarvest: could not read storage', e); }
  return null;
}
function saveState(){
  try{
    safeSet(STORE_KEY, JSON.stringify(state));
  }catch(e){ console.warn('Jarvest: could not save storage', e); }
}

/* ---------- small utils ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

function fmtMoney(n, opts){
  opts = opts || {};
  const sym = (state && state.profile && state.profile.currency) || '$';
  if(state && state.settings && state.settings.privacy && !opts.reveal) return sym+'•••';
  const sign = n < 0 ? '-' : '';
  const v = Math.abs(n || 0);
  const decimals = opts.whole ? 0 : 2;
  return sign + sym + v.toLocaleString(undefined,{minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function fmtDate(iso, opts){
  const d = new Date(iso);
  opts = opts || {};
  if(opts.weekday) return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  if(opts.short) return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  return d.toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'});
}
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function isoWeekKey(d){
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 3 - ((dt.getDay()+6)%7));
  const week1 = new Date(dt.getFullYear(),0,4);
  const weekNo = 1 + Math.round(((dt - week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+weekNo;
}

function haptic(style){
  // Real Taptic feedback isn't exposed to web content on iOS Safari — this
  // is a best-effort hook for platforms that do support the Vibration API
  // (e.g. Android/Chrome). We pair every call with a visual "press" state
  // in CSS so the interaction still feels tactile on iPhone.
  try{
    if(navigator.vibrate){
      if(style==='success') navigator.vibrate([12,40,12]);
      else if(style==='warn') navigator.vibrate(30);
      else navigator.vibrate(10);
    }
  }catch(e){/* no-op */}
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- sheet / nav helpers ---------- */
function openSheet(id){
  document.getElementById('sheetBackdrop').classList.add('show');
  document.getElementById(id).classList.add('show');
  document.body.dataset.openSheet = id;
}
function closeSheet(id){
  document.getElementById(id).classList.remove('show');
  document.getElementById('sheetBackdrop').classList.remove('show');
  delete document.body.dataset.openSheet;
}
function closeAllSheets(){
  document.querySelectorAll('.sheet.show').forEach(s=> s.classList.remove('show'));
  document.getElementById('sheetBackdrop').classList.remove('show');
}

function switchTab(tab){
  uiState.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('screens').scrollTop = 0;
  renderActiveScreen();
}
function renderActiveScreen(){
  if(uiState.activeTab==='home') renderHome();
  else if(uiState.activeTab==='buckets') renderBuckets();
  else if(uiState.activeTab==='insights') renderInsights();
  else if(uiState.activeTab==='settings') renderSettings();
}
function renderAll(){ renderActiveScreen(); }

function showInfo(title, html){
  document.getElementById('sheetInfoTitle').textContent = title;
  document.getElementById('infoBody').innerHTML = html;
  openSheet('sheetInfo');
}

/* ---------- seed / first run ---------- */
function freshState(){
  return {
    profile: { name:'', projectName:'My Savings Plan', avatar:'⚡', currency:'$', defaultRate:20 },
    projects: [],
    goals: [],
    shifts: [],
    movements: [],
    settings: {
      roundUp: { enabled:true, goalId:null },
      payFrequency:'shift', occupation:null, incomeRange:null, referralSource:null,
      monthlyGoal:0, privacy:false, tourSeen:false, activeProjectId:null,
      onboarded:false
    }
  };
}

/* =====================================================================
   PROJECTS
   A project is one income source — a job, a client, a side gig. Money
   logged against it only ever splits across that project's own buckets,
   so two jobs can have completely different goals and percentages.
   ===================================================================== */
const PROJECT_ICONS = ['💼','🍽️','🛍️','🚗','🩺','📦','💻','🎨','🔧','🏫','🎬','🌱'];

function projectsList(){
  return state.projects.filter(p=>!p.archived)
    .slice().sort((a,b)=> ((a.order??a.createdAt) - (b.order??b.createdAt)));
}
function archivedProjects(){ return state.projects.filter(p=>p.archived); }
function activeProjectId(){ return state.settings.activeProjectId; } // null === overview of everything
function activeProject(){ return state.projects.find(p=>p.id===activeProjectId()) || null; }
function setActiveProject(id){
  state.settings.activeProjectId = id;
  saveState();
  renderActiveScreen();
}
function projectById(id){ return state.projects.find(p=>p.id===id) || null; }

/* goals/shifts scoped to a project (or to everything when id is null) */
function goalsOf(projectId){
  const g = state.goals.filter(x=> !x.archived && (projectId==null || x.projectId===projectId));
  return g.slice().sort((a,b)=> ((a.order??a.createdAt) - (b.order??b.createdAt)));
}
function shiftsOf(projectId){
  return state.shifts.filter(s=> projectId==null || s.projectId===projectId);
}
function createProject({name, icon, color}){
  const p = {

/* =====================================================================
   BALANCE LEDGER
   Bucket balances are derived from recorded events (shift allocations +
   withdrawals/transfers) rather than incremented in place. That's what
   makes editing or deleting a past shift correct instead of leaving
   balances silently drifted.
   ===================================================================== */
function recomputeBalances(){
  const map = new Map(state.goals.map(g=>[g.id, 0]));
  state.shifts.forEach(s=>{
    (s.allocations||[]).forEach(a=>{
      if(map.has(a.goalId)) map.set(a.goalId, map.get(a.goalId) + a.amount);
    });
  });
  (state.movements||[]).forEach(m=>{
    if(m.type==='withdraw' && map.has(m.goalId)) map.set(m.goalId, map.get(m.goalId) - m.amount);
    if(m.type==='transfer'){
      if(map.has(m.goalId))   map.set(m.goalId,   map.get(m.goalId)   - m.amount);
      if(map.has(m.toGoalId)) map.set(m.toGoalId, map.get(m.toGoalId) + m.amount);
    }
  });
  state.goals.forEach(g=> g.current = round2(map.get(g.id) || 0));
}

/* =====================================================================
   ALLOCATION ENGINE
   1. computeEffectivePcts — when a goal hits its target, its configured
      % is freed and redistributed proportionally across the remaining
      active goals (Smart Auto-Balancing).
   2. computeAllocation — splits one shift's amount across active goals
      by effective %, then resolves overflow (a goal reaching its target
      mid-shift) via a waterfall that tops up LOCKED/priority goals
      first, before splitting any remainder across unlocked goals.
   ===================================================================== */
function isGoalComplete(g){ return !!(g.target && g.current >= g.target - 0.005); }
function goalRoom(g){ return g.target ? Math.max(0, g.target - g.current) : Infinity; }

function computeEffectivePcts(goals){
  const live = goals.filter(g=>!g.archived);
  const completed = live.filter(g=> isGoalComplete(g) && g.pct>0);
  const active = live.filter(g=> !isGoalComplete(g) && g.pct>0);
  const freedPct = completed.reduce((s,g)=>s+g.pct,0);
  const sumActive = active.reduce((s,g)=>s+g.pct,0);
  return active.map(g=>({
    ...g,
    effectivePct: sumActive>0 ? g.pct + freedPct*(g.pct/sumActive) : g.pct
  }));
}

function computeAllocation(amount, goals){
  const active = computeEffectivePcts(goals);
  if(active.length===0) return { allocations:[], unallocated: round2(amount) };

  const sumPct = active.reduce((s,g)=>s+g.effectivePct,0);
  const baseUnallocated = amount * Math.max(0, 100-sumPct)/100;

  const room = new Map(active.map(g=>[g.id, goalRoom(g)]));
  const alloc = new Map(active.map(g=>[g.id, 0]));
  const order = [...active].sort((a,b)=> (b.locked - a.locked) || (a.createdAt - b.createdAt));

  let overflow = 0;
  order.forEach(g=>{
    const want = amount * g.effectivePct/100;
    const give = Math.min(want, room.get(g.id));
    alloc.set(g.id, give);
    room.set(g.id, room.get(g.id)-give);
    if(want > give) overflow += (want-give);
  });

  let iter = 0;
  while(overflow > 0.005 && iter < 8){
    iter++;
    const recipients = order.filter(g=> room.get(g.id) > 0.005);
    if(recipients.length===0) break;
    const lockedRecipients = recipients.filter(g=>g.locked);
    if(lockedRecipients.length>0){
      for(const g of lockedRecipients){
        if(overflow<=0.005) break;
        const give = Math.min(overflow, room.get(g.id));
        alloc.set(g.id, alloc.get(g.id)+give);
        room.set(g.id, room.get(g.id)-give);
        overflow -= give;
      }
    } else {
      const sumP = recipients.reduce((s,g)=>s+g.effectivePct,0) || recipients.length;
      let given = 0;
      recipients.forEach(g=>{
        const share = overflow * (g.effectivePct/(sumP||1));
        const give = Math.min(share, room.get(g.id));
        alloc.set(g.id, alloc.get(g.id)+give);
        room.set(g.id, room.get(g.id)-give);
        given += give;
      });
      overflow -= given;
      if(given < 0.005) break;
    }
  }

  return {
    allocations: [...alloc.entries()].map(([goalId,amt])=>({goalId, amount:round2(amt)})),
    unallocated: round2(baseUnallocated + overflow)
  };
}

/* apply optional round-up: floor each allocation to a whole currency
   unit and sweep every remainder (plus the base unallocated remainder)
   into the chosen spare-change goal. Nothing is invented — it is only
   the shift's own rounding dust being redirected instead of lost. */
function applyRoundUp(amount, result, goals){
  const rc = state.settings.roundUp;
  if(!rc || !rc.enabled || !rc.goalId) return result;
  const target = goals.find(g=>g.id===rc.goalId);
  if(!target || isGoalComplete(target)) return result;

  // Floor every other bucket to a whole unit, then let the sweep bucket
  // absorb the exact remainder. Deriving the sweep from the shift total
  // (rather than summing individually-rounded scraps) is what guarantees
  // the split still adds up to the cent — rounding each scrap on its own
  // silently destroys sub-cent dust.
  const cleaned = result.allocations.map(a=>
    a.goalId === rc.goalId
      ? { goalId:a.goalId, amount:a.amount }
      : { goalId:a.goalId, amount:Math.floor(a.amount) }
  );
  const newUnallocated = Math.floor(result.unallocated);
  const allocatedElsewhere = cleaned.reduce((s,a)=> s + (a.goalId===rc.goalId ? 0 : a.amount), 0);

  let sweepAmount = round2(amount - allocatedElsewhere - newUnallocated);

  // Never push the sweep bucket past its own target — anything beyond its
  // remaining room stays free cash instead.
  let overflowBack = 0;
  const room = goalRoom(target);
  if(sweepAmount > room){
    overflowBack = round2(sweepAmount - room);
    sweepAmount = round2(room);
  }
  if(sweepAmount < 0){ overflowBack = round2(overflowBack + sweepAmount); sweepAmount = 0; }

  const existing = cleaned.find(a=>a.goalId===rc.goalId);
  if(existing) existing.amount = sweepAmount;
  else cleaned.push({ goalId: rc.goalId, amount: sweepAmount });

  return { allocations: cleaned, unallocated: round2(newUnallocated + overflowBack) };
}

/* Commits a shift: runs the engine, writes goal.current increments,
   stores the shift + its receipt, and (unless silent, used only for
   seeding) surfaces toast/celebration/haptics for freshly-completed goals. */
function commitShift({amount, hours, rate, tips, note, tag, dateISO, projectId, silent}){
  amount = round2(amount);
  projectId = projectId || activeProjectId() || (projectsList()[0] && projectsList()[0].id) || null;
  const scoped = goalsOf(projectId);   // only this project's buckets take a share
  const before = new Map(state.goals.map(g=>[g.id, g.current]));
  let result = computeAllocation(amount, scoped);
  result = applyRoundUp(amount, result, scoped);

  const shift = {
    id: uid(), projectId, dateISO: dateISO || new Date().toISOString(),
    amount, hours: hours||null, rate: rate||null, tips: tips||0,
    note: note||'', tag: tag||'', allocations: result.allocations, unallocated: result.unallocated,
    createdAt: Date.now()
  };
  state.shifts.push(shift);
  sortShifts();
  recomputeBalances();

  const newlyCompleted = state.goals.filter(g=>
    isGoalComplete(g) && before.has(g.id) && before.get(g.id) < g.target - 0.005
  );
  const milestone = !newlyCompleted.length ? findMilestoneCrossing(before) : null;
  saveState();

  if(!silent){
    toast(unitWord(true)+' logged · '+fmtMoney(amount)+' sorted');
    haptic('success');
    if(newlyCompleted.length>0) setTimeout(()=> celebrateGoal(newlyCompleted[0]), 450);
    else if(milestone) setTimeout(()=> toast(`${milestone.g.icon} ${milestone.g.title} just passed ${milestone.pct}%`), 700);
  }
  return shift;
}

function sortShifts(){
  // Two shifts logged for the same day carry the same dateISO, so date
  // alone leaves ties in arbitrary order — break them by entry time so
  // "last shift" is always the one most recently entered.
  state.shifts.sort((a,b)=>
    (new Date(b.dateISO) - new Date(a.dateISO)) || ((b.createdAt||0) - (a.createdAt||0))
  );
}

// smaller wins deserve a nod too, not just hitting 100%
function findMilestoneCrossing(before){
  const marks = [75,50,25];
  for(const g of state.goals){
    if(!g.target || !before.has(g.id)) continue;
    const pctBefore = (before.get(g.id)/g.target)*100;
    const pctNow = (g.current/g.target)*100;
    for(const m of marks){
      if(pctBefore < m && pctNow >= m) return { g, pct:m };
    }
  }
  return null;
}

/* ---------- editing / removing recorded events ---------- */
function deleteShift(id){
  state.shifts = state.shifts.filter(s=>s.id!==id);
  recomputeBalances();
  saveState();
}
function updateShift(id, patch){
  const s = state.shifts.find(x=>x.id===id);
  if(!s) return null;
  Object.assign(s, patch);
  if(patch.amount != null){
    // re-split the edited amount across that project's current buckets
    const snapshot = state.shifts;
    state.shifts = state.shifts.filter(x=>x.id!==id);
    recomputeBalances();
    const scoped = goalsOf(s.projectId);
    let result = computeAllocation(s.amount, scoped);
    result = applyRoundUp(s.amount, result, scoped);
    s.allocations = result.allocations;
    s.unallocated = result.unallocated;
    state.shifts = snapshot;
  }
  sortShifts();
  recomputeBalances();
  saveState();
  return s;
}
function addMovement(m){
  if(!state.movements) state.movements = [];
  state.movements.push(Object.assign({ id:uid(), dateISO:new Date().toISOString(), createdAt:Date.now() }, m));
  recomputeBalances();
  saveState();
}
function deleteMovement(id){
  state.movements = (state.movements||[]).filter(m=>m.id!==id);
  recomputeBalances();
  saveState();
}

function shiftsInRange(days){
  const cutoff = Date.now() - days*86400000;
  return state.shifts.filter(s=> new Date(s.dateISO).getTime() >= cutoff);
}

/* ---- monthly income goal ---- */
function monthToDateEarned(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  return round2(state.shifts.filter(s=> new Date(s.dateISO).getTime() >= start).reduce((a,s)=>a+s.amount,0));
}

/* ---- pacing: is this bucket on track for its target date? ---- */
function goalPace(g){
  if(!g.target || !g.targetDate || isGoalComplete(g)) return null;
  const days = daysBetween(startOfDay(new Date()), startOfDay(new Date(g.targetDate)));
  const remaining = goalRoom(g);
  if(days <= 0) return { overdue:true, remaining, perWeek:remaining, days:0, onTrack:false };
  const perWeek = round2(remaining / (days/7));
  // what this bucket has actually been receiving per week lately
  const recent = shiftsInRange(28);
  const got = recent.reduce((s,sh)=> s + ((sh.allocations||[]).find(a=>a.goalId===g.id)?.amount || 0), 0);
  const actualPerWeek = round2(got/4);
  return { overdue:false, remaining, perWeek, actualPerWeek, days, onTrack: actualPerWeek >= perWeek - 0.005 };
}

/* ---- day-of-week performance ---- */
function dayOfWeekStats(){
  const buckets = Array.from({length:7}, ()=>({total:0, count:0}));
  analyticsShifts().forEach(s=>{
    const d = new Date(s.dateISO).getDay();
    buckets[d].total += s.amount; buckets[d].count++;
  });
  return buckets.map((b,i)=>({
    day:i, total:round2(b.total), count:b.count,
    avg: b.count ? round2(b.total/b.count) : 0
  }));
}
function bestDayOfWeek(){
  const stats = dayOfWeekStats().filter(d=>d.count>=2);
  if(!stats.length) return null;
  return stats.reduce((best,d)=> d.avg>best.avg ? d : best, stats[0]);
}

/* ---- per-employer / per-tag breakdown ---- */
function tagStats(){
  const map = new Map();
  analyticsShifts().forEach(s=>{
    const t = (s.tag||'').trim();
    if(!t) return;
    if(!map.has(t)) map.set(t,{tag:t,total:0,count:0,hours:0});
    const e = map.get(t);
    e.total += s.amount; e.count++; e.hours += (s.hours||0);
  });
  return [...map.values()].map(e=>({
    ...e, total:round2(e.total), hours:round2(e.hours),
    avg: e.count?round2(e.total/e.count):0,
    perHour: e.hours>0 ? round2(e.total/e.hours) : null
  })).sort((a,b)=>b.total-a.total);
}
function knownTags(){ return [...new Set(state.shifts.map(s=>(s.tag||'').trim()).filter(Boolean))]; }

/* ---- cumulative stashed over time ---- */
function cumulativeSeries(points){
  points = points || 12;
  const now = startOfDay(new Date());
  const sorted = [...analyticsShifts()].sort((a,b)=> new Date(a.dateISO)-new Date(b.dateISO));
  if(!sorted.length) return [];
  const firstT = Math.min(new Date(sorted[0].dateISO).getTime(), now.getTime()-6*86400000);
  const span = Math.max(1, now.getTime()+86400000 - firstT);
  const out = [];
  for(let i=1;i<=points;i++){
    const cutoff = firstT + span*(i/points);
    const total = sorted.filter(s=> new Date(s.dateISO).getTime() <= cutoff).reduce((a,s)=>a+s.amount,0);
    out.push({ label: new Date(cutoff).toLocaleDateString(undefined,{month:'short',day:'numeric'}), total: round2(total) });
  }
  return out;
}

function greetingWord(){
  const h = new Date().getHours();
  if(h<5) return 'Still up,';
  if(h<12) return 'Good morning,';
  if(h<17) return 'Good afternoon,';
  if(h<21) return 'Good evening,';
  return 'Good evening,';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  return round2(100 - goals.reduce((s,g)=>s+g.pct,0));
}

function updateGoalPctHint(){
  const input = document.getElementById('goalPctInput');
  const hint = document.getElementById('goalPctHint');
  if(!input) return;
  const budget = goalRemainingPctBudget(uiState.editingGoalId);
  const val = parseFloat(input.value)||0;
  if(val > budget){
    hint.textContent = `Only ${budget}% is unallocated right now — reduce another bucket first, or lower this.`;
    hint.classList.add('warn');
  } else {
    hint.textContent = `${round2(budget-val)}% would remain unallocated (free cash).`;
    hint.classList.remove('warn');
  }

  const icon = document.querySelector('#goalIconGrid .sel')?.dataset.val || GOAL_ICONS[0];

  const targetRaw = document.getElementById('goalTargetInput').value;
  const target = targetRaw ? Math.max(0, parseFloat(targetRaw)) : null;

/* ===================== INSIGHTS ===================== */
function weeklyBuckets(nWeeks){
  const days = 7;
  const buckets = [];
  const now = startOfDay(new Date());
  for(let i=nWeeks-1;i>=0;i--){
    const end = new Date(now.getTime() - i*days*86400000 + (days-1)*86400000 + 86399999);
    const start = new Date(now.getTime() - i*days*86400000);
    const total = analyticsShifts().filter(s=>{
      const t = new Date(s.dateISO).getTime();
      return t>=start.getTime() && t<=end.getTime();
    }).reduce((s,x)=>s+x.amount,0);
    buckets.push({ label: start.toLocaleDateString(undefined,{month:'short',day:'numeric'}), total: round2(total) });
  }
  return buckets;
}
function heatmapDays(n){
  const now = startOfDay(new Date());
  const days = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getTime()-i*86400000);
    const dEnd = d.getTime()+86399999;
    const total = analyticsShifts().filter(s=>{
      const t = new Date(s.dateISO).getTime();
      return t>=d.getTime() && t<=dEnd;
    }).reduce((s,x)=>s+x.amount,0);
    days.push({date:d, total:round2(total)});
  }
  return days;
}
function avgShiftAmount(){
  const list = analyticsShifts();
  return list.length ? list.reduce((s,x)=>s+x.amount,0)/list.length : 0;
}
function personalBestWeek(){
  const weeks = weeklyBuckets(52);
  const priorWeeks = weeks.slice(0,-1);
  return round2(Math.max(0, ...priorWeeks.map(w=>w.total)));
}
function projectGoal(goal, hypoPct){
  const pct = hypoPct!=null ? hypoPct : goal.pct;
  const avgShift = avgShiftAmount();
  const perShift = avgShift * pct/100;
  const remaining = goalRoom(goal);
  if(!isFinite(remaining) || remaining<=0.01 || perShift<=0.01) return null;
  const shiftsNeeded = Math.ceil(remaining/perShift);
  let daysNeeded = null;
  const cadenceList = analyticsShifts();
  if(cadenceList.length>=2){
    const sorted = [...cadenceList].sort((a,b)=>new Date(a.dateISO)-new Date(b.dateISO));
    const span = Math.max(1, daysBetween(new Date(sorted[0].dateISO), new Date(sorted[sorted.length-1].dateISO)));
    const avgGap = span/(sorted.length-1);
    daysNeeded = Math.max(1, Math.round(shiftsNeeded*avgGap));
  }
  return { shiftsNeeded, daysNeeded };
}
function currentStreak(){
  const weeksWithShift = new Set(analyticsShifts().map(s=>isoWeekKey(s.dateISO)));
  let count=0;
  const now = new Date();
  if(weeksWithShift.has(isoWeekKey(now))) count=1;
  let checking = new Date(now.getTime()-7*86400000);
  while(weeksWithShift.has(isoWeekKey(checking))){
    count++;
    checking = new Date(checking.getTime()-7*86400000);
  }
  return count;
}

function renderInsights(){
  const el = document.getElementById('screen-insights');
  const weeks = weeklyBuckets(8);
  const maxWeek = Math.max(1, ...weeks.map(w=>w.total));
  const bars = weeks.map(w=>`<div class="bar-col">
      <div class="bar-val num">${w.total>0?fmtMoney(w.total,{whole:true}):''}</div>
      <div class="bar-fill" style="height:${Math.max(3,(w.total/maxWeek)*100)}%"></div>
      <div class="bar-label">${w.label}</div>
    </div>`).join('');

  const heat = heatmapDays(35);
  const maxDay = Math.max(1, ...heat.map(d=>d.total));
  const heatCells = heat.map(d=>{
    let level = 0;
    if(d.total>0) level = d.total >= maxDay*0.66 ? 3 : d.total >= maxDay*0.33 ? 2 : 1;
    return `<div class="heat-cell" data-level="${level}" title="${fmtDate(d.date.toISOString(),{short:true})}: ${fmtMoney(d.total)}"></div>`;
  }).join('');

  const hoursShifts = analyticsShifts().filter(s=>s.hours);
  const totalHours = round2(hoursShifts.reduce((s,x)=>s+x.hours,0));
  const avgPerShift = analyticsShifts().length ? avgShiftAmount() : 0;

  const projections = goalsOf(activeProjectId())
    .filter(g=>g.target && !isGoalComplete(g))
    .map(g=>({g, p: projectGoal(g)}))
    .filter(x=>x.p)
    .sort((a,b)=>a.p.shiftsNeeded-b.p.shiftsNeeded)
    .slice(0,2);

  const projHtml = projections.length ? projections.map(({g,p})=>`
    <div class="proj-card" style="margin-bottom:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>

    </div>`).join('')
    : `<div class="empty-state"><p>Log a few shifts to unlock projections for your buckets.</p></div>`;

  const streak = currentStreak();

  // cumulative earnings line (rendered as an SVG polyline)
  const cumul = cumulativeSeries(12);
  let cumulHtml = '';
  if(cumul.length>1){
    const maxC = Math.max(1, ...cumul.map(c=>c.total));
    const w=300, h=110, pad=6;
    const pts = cumul.map((c,i)=>{
      const x = pad + (w-pad*2)*(i/(cumul.length-1));
      const y = h - pad - (h-pad*2)*(c.total/maxC);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const areaPts = `${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
    cumulHtml = `
      <div class="section-title">Total earned over time</div>
      <div class="card">
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">

          <span>${cumul[0].label}</span><span class="num">${fmtMoney(cumul[cumul.length-1].total)}</span>
        </div>
      </div>`;
  }

  const bd = bestDayOfWeek();
  const bestDayHtml = bd ? `

      <div class="proj-text"><b>${DAY_NAMES[bd.day]}s</b> are your strongest — averaging <b>${fmtMoney(bd.avg)}</b> across ${bd.count} ${bd.count===1?unitWord():unitWordPlural()}.</div>
    </div>` : '';

  const tags = tagStats();
  const tagHtml = tags.length ? `
    <div class="section-title">By employer</div>
    <div class="card">
      ${tags.map(t=>`<div class="activity-row">

        </div>

  const badgesHtml = BADGE_DEFS.map(b=>{

    return `<div class="badge-chip ${earned?'':'locked'}"><div class="b-icon">${b.icon}</div><div class="b-label">${b.label()}</div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="page-eyebrow">Insights</div>
    <div class="page-title">${activeProject() ? activeProject().icon+' '+escapeHtml(activeProject().name) : 'All projects'}</div>
    ${projSwitchHtml()}

    <div class="stat-row-2">
      <div class="stat-tile"><div class="mini-stat-label">Avg per ${unitWord()}</div><div class="mini-stat-val num" style="font-size:20px;margin-top:4px;">${fmtMoney(avgPerShift)}</div></div>
      <div class="stat-tile"><div class="mini-stat-label">Hours logged</div><div class="mini-stat-val num" style="font-size:20px;margin-top:4px;">${totalHours}h</div></div>
    </div>

    <div class="section-title">Weekly earnings</div>

      <div class="heatmap-legend">less <div class="heat-dot" style="background:var(--surface-2)"></div><div class="heat-dot" style="background:rgba(232,163,61,.35)"></div><div class="heat-dot" style="background:rgba(232,163,61,.62)"></div><div class="heat-dot" style="background:var(--amber)"></div> more</div>
    </div>

    <div class="section-title">Projections</div>
    ${projHtml}
    <button class="btn btn-secondary btn-block" data-action="openWhatif">Try the what-if simulator</button>

/* ---------- what-if simulator ---------- */
function openWhatifSheet(){
  const candidates = activeGoals().filter(g=>g.target && !isGoalComplete(g));
  if(candidates.length===0){
    toast('Add a bucket with a target amount first');
    return;
  }
  uiState.whatifGoalId = uiState.whatifGoalId && candidates.find(g=>g.id===uiState.whatifGoalId)
    ? uiState.whatifGoalId : candidates[0].id;
  renderWhatifBody(candidates);
  openSheet('sheetWhatif');
}
function renderWhatifBody(candidates){
  candidates = candidates || activeGoals().filter(g=>g.target && !isGoalComplete(g));
  const g = state.goals.find(x=>x.id===uiState.whatifGoalId) || candidates[0];
  const rows = candidates.map(c=>`
    <div class="list-select-opt ${c.id===g.id?'sel':''}" data-action="whatifPick" data-id="${c.id}">
      <span>${c.icon} ${escapeHtml(c.title)}</span><span class="num" style="color:var(--text-faint)">${c.pct}%</span>
    </div>`).join('');

  document.getElementById('whatifBody').innerHTML = `
    <div class="list-select" style="margin-bottom:18px;">${rows}</div>
    <div class="whatif-row">
      <div class="whatif-top"><span>Hypothetical allocation</span><b class="num" id="whatifPctLabel">${g.pct}%</b></div>
      <input type="range" id="whatifSlider" min="0" max="100" step="1" value="${g.pct}">
    </div>
    <div class="proj-card" id="whatifResult"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" data-action="applyWhatif" data-id="${g.id}">Apply this % to ${escapeHtml(g.title)}</button>
  `;
  updateWhatifResult(g, g.pct);
  document.getElementById('whatifSlider').addEventListener('input', (e)=>{
    const val = parseInt(e.target.value,10);
    document.getElementById('whatifPctLabel').textContent = val+'%';
    updateWhatifResult(g, val);
  });
}
function updateWhatifResult(goal, hypoPct){
  const p = projectGoal(goal, hypoPct);
  const box = document.getElementById('whatifResult');
  if(!p){
    box.innerHTML = `<div class="proj-text">At ${hypoPct}%, that's too little of your average ${unitWord()} to make progress you can measure yet.</div>`;
    return;
  }
  box.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
    <div class="proj-text">At <b>${hypoPct}%</b>, ${goal.icon} ${escapeHtml(goal.title)} would be done in about <b>${p.shiftsNeeded} ${p.shiftsNeeded===1?unitWord():unitWordPlural()}</b>${p.daysNeeded?` (~${p.daysNeeded} days)`:''}.</div>`;
}
function applyWhatif(goalId){
  const g = state.goals.find(x=>x.id===goalId);
  const val = parseInt(document.getElementById('whatifSlider').value,10);
  const budget = goalRemainingPctBudget(goalId);
  if(val > budget + 0.001){
    toast(`Only ${budget}% is available — lower another bucket first`);
    return;
  }
  g.pct = val;
  saveState();
  closeSheet('sheetWhatif');
  toast('Allocation updated');
  renderActiveScreen();
}

function applyAllocationTemplate(id){
  const t = TEMPLATES.find(x=>x.id===id);
  const goals = activeGoals();
  const locked = goals.filter(g=>g.locked);
  const unlocked = goals.filter(g=>!g.locked);
  if(locked.length===0 && unlocked.length===0){ toast('Add a bucket first'); return; }
  const sumLockedPct = locked.reduce((s,g)=>s+g.pct,0);
  const sumUnlockedPct = unlocked.reduce((s,g)=>s+g.pct,0);
  locked.forEach(g=>{
    const weight = sumLockedPct>0 ? g.pct/sumLockedPct : 1/locked.length;
    g.pct = round2(t.locked*weight);
  });
  unlocked.forEach(g=>{
    const weight = sumUnlockedPct>0 ? g.pct/sumUnlockedPct : 1/unlocked.length;
    g.pct = round2(t.unlocked*weight);
  });
  saveState();
  const note = locked.length===0 ? ' (no priority buckets yet, so that share stays free)' : '';
  toast(`Applied "${t.label}"${note}`);
  renderSettings();
  if(uiState.activeTab==='buckets') renderBuckets();
}

function exportCsv(){
  const rows = [['Date','Amount','Hours','Rate','Tips','Note','Allocations','Unallocated']];
  state.shifts.slice().sort((a,b)=>new Date(a.dateISO)-new Date(b.dateISO)).forEach(s=>{
    const allocStr = s.allocations.filter(a=>a.amount>0.004).map(a=>{
      const g = state.goals.find(x=>x.id===a.goalId);
      return (g?g.title:'Deleted bucket')+':'+a.amount.toFixed(2);
    }).join(' | ');
    rows.push([
      new Date(s.dateISO).toISOString().slice(0,10),
      s.amount.toFixed(2), s.hours||'', s.rate||'', (s.tips||0).toFixed(2),
      (s.note||'').replace(/,/g,';'), allocStr, (s.unallocated||0).toFixed(2)
    ]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jarvest-shifts.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('CSV ready to save');
}

    <button class="btn btn-primary btn-block" style="margin-top:16px;" data-action="submitLogShift">${state.settings.payFrequency==='payday'?'Log paycheck':'Log shift'}</button>
  `;
  document.getElementById('logShiftBody').addEventListener('input', recomputeLogShiftPreview);
  recomputeLogShiftPreview();
}

function computeLogShiftAmount(){
  if(uiState.logShiftMode==='total'){
    return round2(parseFloat(document.getElementById('lsAmount')?.value)||0);
  }
  const hours = parseFloat(document.getElementById('lsHours')?.value)||0;
  const rate = parseFloat(document.getElementById('lsRate')?.value)||0;
  const ot = parseFloat(document.getElementById('lsOT')?.value)||0;
  const tips = parseFloat(document.getElementById('lsTips')?.value)||0;
  const breakMin = parseFloat(document.getElementById('lsBreak')?.value)||0;
  const base = hours*rate;
  const otPay = ot*rate*1.5;
  const breakDeduction = (breakMin/60)*rate;
  return round2(Math.max(0, base+otPay+tips-breakDeduction));
}

function recomputeLogShiftPreview(){
  const amount = computeLogShiftAmount();
  if(uiState.logShiftMode==='hourly'){
    const hours = parseFloat(document.getElementById('lsHours')?.value)||0;
    const rate = parseFloat(document.getElementById('lsRate')?.value)||0;
    const ot = parseFloat(document.getElementById('lsOT')?.value)||0;
    const tips = parseFloat(document.getElementById('lsTips')?.value)||0;
    const breakMin = parseFloat(document.getElementById('lsBreak')?.value)||0;
    const base = hours*rate, otPay = ot*rate*1.5, breakDeduction=(breakMin/60)*rate;
    const box = document.getElementById('lsCalcBreakdown');
    if(box){
      box.innerHTML = `
        <div class="calc-row"><span>Base (${hours||0}h × ${fmtMoney(rate)})</span><b>${fmtMoney(base)}</b></div>
        ${ot? `<div class="calc-row"><span>Overtime (${ot}h × 1.5)</span><b>${fmtMoney(otPay)}</b></div>` : ''}
        ${tips? `<div class="calc-row"><span>Tips</span><b>${fmtMoney(tips)}</b></div>` : ''}
        ${breakMin? `<div class="calc-row"><span>Unpaid break (${breakMin}min)</span><b>-${fmtMoney(breakDeduction)}</b></div>` : ''}
        <div class="calc-total"><span>Shift total</span><b>${fmtMoney(amount)}</b></div>
      `;
    }
  }
  const scoped = goalsOf(uiState.logProjectId);
  const result = applyRoundUp(amount, computeAllocation(amount, scoped), scoped);
  const lines = result.allocations.filter(a=>a.amount>0.004).map(a=>{
    const g = state.goals.find(x=>x.id===a.goalId);
    if(!g) return '';
    return `<div class="receipt-line"><span>${g.icon} ${escapeHtml(g.title)}</span><b class="num">${fmtMoney(a.amount)}</b></div>`;
  }).join('') || '';
  document.getElementById('lsPreview').innerHTML = lines +
    `<div class="receipt-line"><span>Free cash</span><b class="num">${fmtMoney(result.unallocated)}</b></div>` +
    (amount<=0 ? `<div class="field-hint" style="margin-top:6px;">Enter an amount to see the split.</div>` : '');
}

function setLogMode(mode){ uiState.logShiftMode = mode; buildLogShiftBody(); }

function submitLogShift(){
  if(!projectsList().length){ toast('Create a project first'); return; }
  if(!uiState.logProjectId){ toast('Pick which project this is from'); return; }
  const amount = computeLogShiftAmount();
  if(amount<=0){ toast('Enter an amount greater than zero'); return; }
  const dateVal = document.getElementById('lsDate').value || todayInputValue();
  const dateISO = new Date(dateVal+'T12:00:00').toISOString();
  const note = document.getElementById('lsNote').value.trim();
  let hours=null, rate=null, tips=0;
  if(uiState.logShiftMode==='hourly'){
    hours = parseFloat(document.getElementById('lsHours').value)||0;
    rate = parseFloat(document.getElementById('lsRate').value)||0;
    tips = parseFloat(document.getElementById('lsTips').value)||0;
  }
  commitShift({amount, hours, rate, tips, note, tag:(document.getElementById('lsTag')||{}).value?.trim()||'', dateISO, projectId:uiState.logProjectId});
  closeSheet('sheetLogShift');
  renderActiveScreen();
  if(uiState.activeTab!=='home') { /* home will refresh next visit */ }
}

/* ---------- shift receipt viewer ---------- */
function viewShift(id){
  const s = state.shifts.find(x=>x.id===id);
  if(!s) return;
  const lines = s.allocations.filter(a=>a.amount>0.004).map(a=>{
    const g = state.goals.find(x=>x.id===a.goalId);
    return `<div class="receipt-line"><span>${g?g.icon+' '+escapeHtml(g.title):'Deleted bucket'}</span><b class="num">${fmtMoney(a.amount)}</b></div>`;
  }).join('');
  const detail = s.hours ? `<div class="receipt-line"><span>Hours × rate</span><b>${s.hours}h × ${fmtMoney(s.rate)}</b></div>` : '';
  const tipsLine = s.tips ? `<div class="receipt-line"><span>Tips included</span><b class="num">${fmtMoney(s.tips)}</b></div>` : '';
  showInfo(unitWord(true)+' · '+fmtDate(s.dateISO,{short:true}), `
    <div class="receipt-line"><span>Total earned</span><b class="num">${fmtMoney(s.amount)}</b></div>
    ${detail}${tipsLine}
    ${s.note?`<div class="receipt-line"><span>Note</span><b>${escapeHtml(s.note)}</b></div>`:''}

const TOPIC_TITLES = {
  allocation:'How auto-allocation works', templates:'Allocation templates',

};

function wireStatic(){
  document.addEventListener('click', function(e){
    const closeBtn = e.target.closest('[data-close]');
    if(closeBtn){ closeSheet(closeBtn.dataset.close); return; }
    if(e.target.id==='sheetBackdrop'){ closeAllSheets(); return; }

    const tabBtn = e.target.closest('.tab-btn');
    if(tabBtn){ haptic(); switchTab(tabBtn.dataset.tab); return; }

    const iconOpt = e.target.closest('#goalIconGrid .emoji-opt');
    if(iconOpt){
      document.querySelectorAll('#goalIconGrid .emoji-opt').forEach(b=>b.classList.remove('sel'));
      iconOpt.classList.add('sel');
      return;
    }
    const colorOpt = e.target.closest('#goalColorGrid .swatch-opt');
    if(colorOpt){
      document.querySelectorAll('#goalColorGrid .swatch-opt').forEach(b=>b.classList.remove('sel'));
      colorOpt.classList.add('sel');

    }

        break;
      case 'confirmMove': confirmMove(); break;
      case 'toggleArchive': toggleArchive(id); break;

      case 'saveEditShift': saveEditShift(); break;
      case 'deleteShift': confirmDeleteShift(id); break;
      case 'undoLast': undoLastShift(); break;
      case 'openAlloc': openAllocSheet(); break;
      case 'saveAlloc': saveAlloc(); break;
      case 'togglePrivacy': togglePrivacy(); break;
      case 'saveMonthlyGoal': saveMonthlyGoal(); break;

      case 'editProject': openProjectSheet(id); break;

function finishOnboarding(){
  const ob = uiState.ob;
  const incomeInfo = INCOME_RANGES.find(r=>r.key===ob.income) || INCOME_RANGES[1];
  const occInfo = OCCUPATIONS.find(o=>o.key===ob.occupation);

  state = freshState();
  state.profile.name = ob.name || 'there';
  state.profile.projectName = ob.projectName || (ob.name ? ob.name+"'s Savings Plan" : 'My Savings Plan');
  state.profile.defaultRate = incomeInfo.rate;
  state.settings.payFrequency = ob.payFrequency;
  state.settings.occupation = ob.occupation;
  state.settings.incomeRange = ob.income;
  state.settings.referralSource = ob.referral;
  state.settings.onboarded = true;

  // every income source is a project — create the first from their answers
  const firstProject = createProject({
    name: occInfo ? occInfo.label : 'My Work',
    icon: occInfo ? occInfo.emoji : '💼',
    color: GOAL_COLORS[0]
  });
  state.settings.activeProjectId = firstProject.id;

  if(ob.wantSample && occInfo){
    occInfo.suggestions.forEach((s,i)=>{
      state.goals.push({
        id:uid(), projectId:firstProject.id, title:s.title, icon:s.icon, color:s.color,
        target: Math.round((350+i*300)*incomeInfo.scale/10)*10,
        current:0, pct:s.pct, locked:false,
        targetDate:null, archived:false, createdAt:Date.now()+i, order:Date.now()+i
      });
    });
    const ef = state.goals.find(g=>g.title.toLowerCase().includes('emergency'));
    if(ef) ef.locked = true;
    state.settings.roundUp.goalId = ef ? ef.id : (state.goals[0] && state.goals[0].id);

function tourWait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function startTour(){
  closeAllSheets();
  uiState.tourStep = 0;
  document.getElementById('tourOverlay').classList.add('show');
  await goToTourStep(0);
}
async function goToTourStep(i){
  uiState.tourStep = i;
  const step = TOUR_STEPS[i];
  try{ await step.enter(); }catch(e){ /* keep the tour resilient even if a step's action fails */ }
  await tourWait(380);
  await scrollTargetIntoView(step.selector);
  positionSpotlight(step.selector);
  renderTourCard(step, i);
}

/* On a phone most tour targets sit below the fold. Without this the
   spotlight lands off-screen and the user just sees a dimmed, empty
   page — so scroll the target to the middle before measuring it. */
async function scrollTargetIntoView(selector){
  const el = selector ? document.querySelector(selector) : null;
  if(!el || typeof el.scrollIntoView !== 'function') return;
  try{ el.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); }
  catch(e){ try{ el.scrollIntoView(); }catch(e2){ /* ignore */ } }
  await tourWait(430); // let the smooth scroll settle before measuring
}
function positionSpotlight(selector){
  const hole = document.getElementById('tourHole');
  const el = selector ? document.querySelector(selector) : null;
  if(!el){ hole.style.opacity = '0'; window.__tourLastRect = null; return; }
  const r = el.getBoundingClientRect();
  const pad = 8;
  hole.style.opacity = '1';
  hole.style.top = Math.max(0,r.top-pad)+'px';
  hole.style.left = Math.max(0,r.left-pad)+'px';
  hole.style.width = (r.width+pad*2)+'px';
  hole.style.height = (r.height+pad*2)+'px';
  window.__tourLastRect = r;
}
function renderTourCard(step, i){
  const card = document.getElementById('tourCard');
  const r = window.__tourLastRect;
  const vh = window.innerHeight, vw = window.innerWidth;
  card.innerHTML = `
    <div class="tour-eyebrow">Step ${i+1} of ${TOUR_STEPS.length}</div>
    <div class="tour-title">${step.title}</div>
    <div class="tour-text">${step.text}</div>
    <div class="tour-foot">
      <div class="tour-dots">${TOUR_STEPS.map((_,d)=>`<i class="${d===i?'on':''}"></i>`).join('')}</div>
      <div class="tour-btnrow">
        <button class="btn btn-ghost btn-sm" data-action="tourSkip">Skip</button>
        ${i>0?`<button class="btn btn-secondary btn-sm" data-action="tourBack">Back</button>`:''}
        <button class="btn btn-primary btn-sm" data-action="tourNext">${i===TOUR_STEPS.length-1?'Done':'Next'}</button>
      </div>
    </div>`;
  // Measure the card for real rather than assuming a fixed height — the
  // copy length varies per step, and a guessed height is what pushed the
  // card off the bottom of the screen and under the tab bar.
  const cardH = card.offsetHeight || 180;
  const tabBar = document.getElementById('tabbar');
  const tabH = tabBar ? tabBar.offsetHeight : 76;
  const topLimit = 12;
  const bottomLimit = vh - tabH - 12; // never sit beneath the tab bar
  const gap = 14;

  let top;
  if(!r){
    top = (vh - cardH)/2;                    // no target: centre it
  } else if(r.bottom + gap + cardH <= bottomLimit){
    top = r.bottom + gap;                    // below the highlighted element
  } else if(r.top - gap - cardH >= topLimit){
    top = r.top - gap - cardH;               // above it
  } else {
    top = bottomLimit - cardH;               // last resort: park above the tab bar
  }
  top = Math.max(topLimit, Math.min(top, bottomLimit - cardH));
  card.style.top = top+'px';
  card.style.left = '22px';
}

  if(uiState.tourStep >= TOUR_STEPS.length-1){ endTour(); return; }
  goToTourStep(uiState.tourStep+1);

function bucketHistory(goalId){
  const rows = [];
  state.shifts.forEach(s=>{
    const a = (s.allocations||[]).find(x=>x.goalId===goalId);
    if(a && a.amount>0.004) rows.push({ kind:'in', label:unitWord(true), dateISO:s.dateISO, amount:a.amount, id:s.id, note:s.note||s.tag||'' });
  });
  (state.movements||[]).forEach(m=>{
    if(m.type==='withdraw' && m.goalId===goalId) rows.push({ kind:'out', label:'Spent', dateISO:m.dateISO, amount:-m.amount, id:m.id, note:m.note||'', movement:true });
    if(m.type==='transfer' && m.goalId===goalId){
      const to = state.goals.find(x=>x.id===m.toGoalId);
      rows.push({ kind:'out', label:'To '+(to?to.title:'another bucket'), dateISO:m.dateISO, amount:-m.amount, id:m.id, note:'', movement:true });
    }
    if(m.type==='transfer' && m.toGoalId===goalId){
      const from = state.goals.find(x=>x.id===m.goalId);
      rows.push({ kind:'in', label:'From '+(from?from.title:'another bucket'), dateISO:m.dateISO, amount:m.amount, id:m.id, note:'', movement:true });
    }
  });
  return rows.sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO));

/* Full backup: CSV is for reading elsewhere, JSON is for actually
   restoring — it round-trips every bucket, entry and setting. */
function exportJson(){
  const payload = { app:'jarvest', version:APP_VERSION, exportedAt:new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jarvest-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Backup ready to save');
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if(!incoming || !Array.isArray(incoming.goals) || !Array.isArray(incoming.shifts)){
        toast("That file doesn't look like a Jarvest backup"); return;
      }
      if(!confirm('Restore this backup? It replaces everything currently on this device.')) return;
      state = incoming;
      if(!state.movements) state.movements = [];
      if(!state.settings) state.settings = freshState().settings;
      migrateState();
      recomputeBalances();
      saveState();
      toast('Backup restored');
      switchTab('home');
    }catch(e){
      toast("Couldn't read that file");
    }
  };
  reader.onerror = ()=> toast("Couldn't read that file");
  reader.readAsText(file);
}

/* iOS caches installed web apps aggressively, so give people a way to
   see which build they're on and pull a fresh one on demand. */
function checkForUpdate(){
  toast('Fetching the latest version…');
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(rs=>{
      rs.forEach(r=> r.update && r.update());
    }).catch(()=>{});
  }
  if(window.caches && caches.keys){
    caches.keys().then(keys=> Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
  }
  setTimeout(()=>{
    const u = new URL(location.href);
    u.searchParams.set('v', Date.now());
    location.replace(u.toString());
  }, 900);
}

/* Older saves predate features added later — fill in anything missing so
   an existing install never lands on undefined fields. */
function migrateState(){
  const def = freshState();
  if(!state.profile) state.profile = def.profile;
  if(!state.settings) state.settings = def.settings;
  if(!Array.isArray(state.projects)) state.projects = [];
  if(!Array.isArray(state.goals)) state.goals = [];
  if(!Array.isArray(state.shifts)) state.shifts = [];
  if(!Array.isArray(state.movements)) state.movements = [];
  Object.keys(def.settings).forEach(k=>{
    if(state.settings[k] === undefined) state.settings[k] = def.settings[k];
  });
  if(!state.settings.roundUp) state.settings.roundUp = def.settings.roundUp;
  if(!state.profile.projectName){
    state.profile.projectName = state.profile.name ? state.profile.name+"'s Savings Plan" : 'My Savings Plan';
  }

  // Saves made before projects existed have loose goals/shifts — adopt
  // them into one default project so nothing is orphaned or lost.
  const orphanGoals  = state.goals.filter(g=>!g.projectId);
  const orphanShifts = state.shifts.filter(s=>!s.projectId);
  let createdDefaultProject = false;
  if(state.projects.length === 0 && (orphanGoals.length || orphanShifts.length || state.settings.onboarded)){
    const occ = OCCUPATIONS.find(o=>o.key===state.settings.occupation);
    createProject({ name: occ ? occ.label : 'My Work', icon: occ ? occ.emoji : '💼', color: GOAL_COLORS[0] });
    createdDefaultProject = true;
  }
  const fallbackId = state.projects.length ? state.projects[0].id : null;
  orphanGoals.forEach(g=> g.projectId = fallbackId);
  orphanShifts.forEach(s=> s.projectId = fallbackId);
  if(state.settings.activeProjectId && !projectById(state.settings.activeProjectId)){
    state.settings.activeProjectId = fallbackId;
  }
  // null is a valid choice ("All projects") for an existing user, but a save
  // that predates projects should open in the project we just made for it.
  if(createdDefaultProject) state.settings.activeProjectId = fallbackId;

  state.projects.forEach((p,i)=>{
    if(p.order === undefined) p.order = p.createdAt || i;
    if(p.archived === undefined) p.archived = false;
  });
  state.goals.forEach((g,i)=>{
    if(g.order === undefined) g.order = g.createdAt || i;
    if(g.archived === undefined) g.archived = false;
  });
  state.shifts.forEach(s=>{
    if(s.tag === undefined) s.tag = '';
    if(!Array.isArray(s.allocations)) s.allocations = [];
    if(s.unallocated === undefined) s.unallocated = 0;
  });
}

function registerServiceWorker(){
  // Installed iOS web apps cache hard. A network-first worker means the
  // app pulls the newest build whenever there's a connection, and still
  // opens offline from cache when there isn't.
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine without it */ });
}

      <button class="btn btn-secondary btn-block" style="margin-top:10px;" data-action="archiveProject" data-id="${p.id}">${p.archived?'Restore project':'Archive project'}</button>
      <button class="btn btn-danger btn-block" style="margin-top:10px;" data-action="deleteProject" data-id="${p.id}">Delete project</button>
      <div class="field-hint" style="margin-top:8px;">Deleting removes its ${bucketCount} bucket${bucketCount===1?'':'s'} and ${shiftCount} logged ${shiftCount===1?unitWord():unitWordPlural()} too.</div>
    `:''}
  `;
  openSheet('sheetProject');
}

function saveProjectFromSheet(){
  const name = document.getElementById('projNameInput').value.trim();
  if(!name){ toast('Give the project a name'); return; }
  const icon = document.querySelector('#projIconGrid .sel')?.dataset.val || PROJECT_ICONS[0];
  const color = document.querySelector('#projColorGrid .sel')?.dataset.val || GOAL_COLORS[0];
  if(uiState.editingProjectId){
    Object.assign(projectById(uiState.editingProjectId), {name, icon, color});
    toast('Project updated');
  } else {
    const p = createProject({name, icon, color});
    state.settings.activeProjectId = p.id;   // jump straight into the new one
    toast('Project created — now add its buckets');
  }
  saveState();
  closeSheet('sheetProject');
  renderActiveScreen();
}

function archiveProject(id){
  const p = projectById(id);
  if(!p) return;
  p.archived = !p.archived;
  if(p.archived && activeProjectId()===id) state.settings.activeProjectId = null;
  saveState();
  closeSheet('sheetProject');
  toast(p.archived?'Project archived':'Project restored');
  renderActiveScreen();
}

function deleteProjectConfirmed(id){
  const p = projectById(id);
  if(!p) return;
  const gCount = state.goals.filter(g=>g.projectId===id).length;
  const sCount = state.shifts.filter(s=>s.projectId===id).length;
  if(!confirm(`Delete "${p.name}"? This also removes its ${gCount} bucket${gCount===1?'':'s'} and ${sCount} logged ${sCount===1?unitWord():unitWordPlural()}. This can't be undone.`)) return;
  const goalIds = new Set(state.goals.filter(g=>g.projectId===id).map(g=>g.id));
  state.goals = state.goals.filter(g=>g.projectId!==id);
  state.shifts = state.shifts.filter(s=>s.projectId!==id);
  state.movements = (state.movements||[]).filter(m=> !goalIds.has(m.goalId) && !goalIds.has(m.toGoalId));
  state.projects = state.projects.filter(x=>x.id!==id);
  if(activeProjectId()===id) state.settings.activeProjectId = projectsList()[0] ? projectsList()[0].id : null;
  recomputeBalances();
  saveState();
  closeSheet('sheetProject');
  toast('Project deleted');
  renderActiveScreen();
}

function pickProject(id){
  setActiveProject(id || null);
  haptic();
}

function boot(){
  persistenceOK = storageProbe();
  wireStatic();
  registerServiceWorker();
  const loaded = loadState();

  if(loaded){
    state = loaded;
    migrateState();
    recomputeBalances();  // balances are derived, so rebuild them from the ledger
    setTimeout(()=>{
      document.getElementById('splash').classList.add('gone');
      document.getElementById('appShell').classList.add('show');
      switchTab('home');
      if(!persistenceOK) showEnvBanner();
    }, 950);
  } else {
    setTimeout(()=>{
      document.getElementById('splash').classList.add('gone');
      startOnboarding();
      if(!persistenceOK) showEnvBanner();
    }, 950);
  }
}

boot();
</script>
</body>
</html>
